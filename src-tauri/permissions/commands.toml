[[permission]]
identifier = "allow-translate-text"
description = "Allows the translate_text command."
commands.allow = ["translate_text"]

[[permission]]
identifier = "allow-get-settings"
description = "Allows reading the local engine choice and saved API keys."
commands.allow = ["get_settings"]

[[permission]]
identifier = "allow-save-settings"
description = "Allows saving the local engine choice and API keys."
commands.allow = ["save_settings"]

[[permission]]
identifier = "allow-save-key"
description = "Allows saving a single API key."
commands.allow = ["save_key"]

[[permission]]
identifier = "allow-dismiss"
description = "Allows hiding the result window."
commands.allow = ["dismiss"]

[[permission]]
identifier = "allow-speak"
description = "Allows reading text aloud."
commands.allow = ["speak"]

[[permission]]
identifier = "allow-replace-text"
description = "Allows writing a translation back into the source window."
commands.allow = ["replace_text"]

[[permission]]
identifier = "allow-undo-text"
description = "Allows undoing a writeback in the source window."
commands.allow = ["undo_text"]

[[permission]]
identifier = "allow-copy-text"
description = "Allows copying a result to the clipboard."
commands.allow = ["copy_text"]

[[permission]]
identifier = "allow-explain-diff"
description = "Allows asking the AI to explain a polish."
commands.allow = ["explain_diff"]

[[permission]]
identifier = "allow-test-ai-connection"
description = "Allows testing an AI provider connection with a minimal request."
commands.allow = ["test_ai_connection"]

[[permission]]
identifier = "allow-detect-ollama"
description = "Allows detecting a local Ollama instance and listing its models."
commands.allow = ["detect_ollama"]

[[permission]]
identifier = "allow-delete-key"
description = "Allows removing a saved API key."
commands.allow = ["delete_key"]

[[permission]]
identifier = "allow-autostart"
description = "Allows reading and toggling launch-at-login."
commands.allow = ["get_autostart", "set_autostart"]

[[permission]]
identifier = "allow-bar"
description = "Allows handling action bar interactions."
commands.allow = ["bar_pick", "bar_hide", "bar_layout"]

[[permission]]
identifier = "allow-open-settings"
description = "Allows opening the settings window."
commands.allow = ["open_settings"]

[[permission]]
identifier = "allow-settings-close"
description = "Allows closing or hiding the settings window."
commands.allow = ["settings_close"]

[[permission]]
identifier = "allow-panel-resize"
description = "Allows resizing the translation panel."
commands.allow = ["panel_resize"]

[[permission]]
identifier = "allow-screenshot-start"
description = "Allows starting screenshot translation."
commands.allow = ["screenshot_translate"]

[[permission]]
identifier = "allow-overlay"
description = "Allows the screenshot overlay to read OCR data and submit a selection."
commands.allow = ["get_screenshot", "get_ocr_result", "overlay_select", "overlay_cancel", "pin_result"]

[[permission]]
identifier = "allow-pinned-data"
description = "Allows reading and closing a pinned OCR result."
commands.allow = ["get_pinned_result", "close_pinned"]

[[permission]]
identifier = "allow-stop-speak"
description = "Allows stopping current speech output."
commands.allow = ["stop_speak"]
